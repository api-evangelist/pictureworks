description: PictureWorks (PictureWorks Technology) was a digital imaging technology company based in
  Danville, California that built imaging tools and services for the real estate and e-commerce
  industries, enabling online visual presentation of products and properties. It was surfaced as a
  portfolio company of Battery Ventures and added to the API Evangelist network as an enrichment lead.
  The company was acquired by Internet Pictures Corporation (IPIX) in 2000. No public developer API,
  OpenAPI definition, developer portal, or SDK surface could be located for this entity during
  enrichment; the active pictureworks.com (Pictureworks Group, Singapore theme-park imaging) is a
  separate, unrelated company and is not linked here to avoid mis-attribution.
